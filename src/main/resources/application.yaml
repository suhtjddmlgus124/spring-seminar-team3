spring:
  application:
    name: seminar
  datasource:
    # DB datasource의 정의. mySQL DB는 docker compose up -d 로 compose.yaml 을 실행하는 방식으로 띄웁시다.
    url: jdbc:mysql://localhost:3306/waggle?characterEncoding=UTF-8
    username: waggle
    password: waggle
  flyway:
    # 애플리케이션이 뜰 때 db/migration 의 V{n}__*.sql 을 버전 순서대로 실행
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  # Access Token 서명 키(HS256). UTF-8 로 32바이트 이상이어야 합니다.
  # 공개 저장소라 여기 적은 값은 개발용입니다. 배포할 때는 환경 변수 JWT_SECRET 으로 덮어쓰세요.
  secret: ${JWT_SECRET:waggle-local-development-secret-change-me}
